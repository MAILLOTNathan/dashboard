# Local development and first deployment.
#
# Default (`docker compose up -d`) starts PostgreSQL only, bound to 127.0.0.1.
# The full stack (`docker compose --profile full up -d --build`) also runs the app and
# a small reverse proxy that serves it on APP_HOST, the front door (`localhost:8888` by
# default; see README).
#
# PostgreSQL is never published on the public interface: in production only the
# application container reaches it over the internal network.

# Shared by the migration service and the application: a single source of truth
# avoids the two containers disagreeing about the database they use.
x-database-url: &database-url postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${POSTGRES_DB:-dashboard}?schema=public

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Localhost only, so a development machine can inspect the database.
      # Override POSTGRES_PORT when another local project already uses 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      # The public origin, used by Auth.js to build absolute callback URLs. It cannot
      # be inferred here: the standalone server would fall back to its own container
      # name and internal port (http://<container-id>:3000), which no browser can
      # reach. Keep it identical to the origin you actually browse, and to APP_HOST
      # below: cookies are per host, so a mismatch means signing in on one origin and
      # being unknown on the other.
      AUTH_URL: ${AUTH_URL:-http://dashboard.localhost:8888}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-EUR}
      NEXT_PUBLIC_DEFAULT_TIME_ZONE: ${NEXT_PUBLIC_DEFAULT_TIME_ZONE:-Europe/Paris}
    # The application port itself, published on loopback for debugging only: the
    # address to browse is the proxy one (localhost:8888, see the `proxy` service).
    # The comment above still applies in production, where only the proxy is exposed.
    ports:
      - "127.0.0.1:3000:8888"

  # Serves the application on a hostname instead of a port: the same shape as
  # production, where a reverse proxy terminates HTTPS in front of the Next.js server.
  # It belongs to the `full` profile rather than a profile of its own because it
  # depends on `app`: a second profile only meant that one forgotten flag left the
  # hostname refusing connections while the rest of the stack looked healthy.
  proxy:
    profiles: ["full"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      # The site address the proxy answers for, and the one to type in the browser.
      # It carries the port on purpose: Caddy listens on the port of its site
      # address, so it has to match the published port just below. The scheme matters
      # too: `http://` serves plain HTTP (what you want locally, nothing to trust),
      # while a bare hostname on a server serves HTTPS with an obtained certificate.
      # `dashboard.localhost` needs no hosts entry: `.localhost` and its subdomains
      # are reserved for loopback (RFC 6761) and resolve to this machine on their own.
      APP_HOST: ${APP_HOST:-http://dashboard.localhost}
    ports:
      # The proxy port, which is the one to browse. It is published on all interfaces
      # so a remote machine can reach it, but only if the firewall allows it.
      - "${APP_PORT:-8888}:8888"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account data: only used when APP_HOST has no scheme, but a
      # proxy that forgets them re-requests a certificate on every restart.
      - proxy-data:/data
      - proxy-config:/config

  # One-shot migration runner: applies pending migrations, then exits. Re-running
  # it is a no-op. The app only starts once it has succeeded, so a failed
  # migration never boots a server against an outdated schema.
  # Note: the Prisma CLI is not in the application image on purpose; use this
  # service to inspect a migration (`docker compose --profile full logs migrate`).
  migrate:
    profiles: ["full"]
    build:
      context: .
      target: db-tools
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url

  # One-shot owner bootstrap: creates the single owner account from SEED_OWNER_*,
  # or refreshes its name, then exits. It runs on every `up` and is idempotent. The
  # environment password is written when the account is created; a password changed
  # from the Compte page is kept, unless SEED_OWNER_FORCE_PASSWORD=true, which is
  # also the way back from a forgotten password. There is no public sign-up, so the
  # app waits for this service: without an account there is nothing to log in with.
  # The seed also needs AUTH_SECRET and INTEGRATION_ENCRYPTION_KEY because it
  # imports @/lib/db, which validates the whole server environment.
  seed:
    profiles: ["full"]
    build:
      context: .
      target: db-tools
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:?SEED_OWNER_EMAIL is required}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?SEED_OWNER_PASSWORD is required}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Proprietaire}
      # Set to true to overwrite an existing password with SEED_OWNER_PASSWORD again,
      # which is the way back from a forgotten password. Left false, the seed only
      # writes the password when it creates the account, so a password changed from
      # the Compte page survives a restart.
      SEED_OWNER_FORCE_PASSWORD: ${SEED_OWNER_FORCE_PASSWORD:-false}
    command: ["npx", "prisma", "db", "seed"]

volumes:
  db-data:
  proxy-data:
  proxy-config:
